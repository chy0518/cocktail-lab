<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    >
    <meta name="format-detection" content="telephone=no,email=no,address=no">
    <title>调酒实验室</title>
    <link rel="stylesheet" href="./css/main.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header id="step-header" class="step-header"></header>
      <main class="app-main">
        <section id="mix-stage" class="mix-stage"></section>
        <section id="option-panel" class="option-panel"></section>
      </main>
      <nav id="bottom-controls" class="bottom-controls"></nav>
    </div>

    <div id="error-screen" class="error-screen hidden" aria-live="assertive" aria-atomic="true">
      <div class="error-screen__card">
        <p class="error-screen__label">System Message</p>
        <p class="error-screen__text">哎呀，出错了，请重启试试吧~</p>
      </div>
    </div>

    <div id="poster-modal" class="poster-modal hidden" aria-hidden="true"></div>

    <script src="./js/app.js"></script>
  </body>
</html>
